<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Média</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Calculadora de Média</h1>

    <div class="campos">
      <input type="number" class="nota" placeholder="Nota 1">
      <input type="number" class="nota" placeholder="Nota 2">
      <input type="number" class="nota" placeholder="Nota 3">
      <input type="number" class="nota" placeholder="Nota 4">
    </div>

    <button id="calcular">Calcular média</button>
    <p id="resultado"></p>
  </main>

 <script src="js/script.js"></script>
</body>
</html>
